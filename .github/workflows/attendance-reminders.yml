name: Attendance reminders (manual fallback)

# Automatic scheduling runs inside the Render backend. GitHub's scheduled
# events can arrive hours late, so retain only an explicit manual fallback.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Reminder to send (Sunday only)
        required: true
        default: start
        type: choice
        options:
          - start
          - teacher_missing
          - admin_missing

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send reminders
        env:
          API_URL: https://ahadiya-student-management-system.onrender.com
          CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
          PHASE: ${{ inputs.phase }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret NOTIFICATION_CRON_SECRET is missing. It must match the Render backend value."
            exit 1
          fi
          curl --fail-with-body --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors \
            -X POST "$API_URL/api/notifications/attendance-reminders/$PHASE" \
            -H "X-Cron-Secret: $CRON_SECRET"
