<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Al-Meera Ahadiya School Management System — Student, attendance, and class management" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ahadiya School" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/ahadiya-logo-black.png" />
    <script>
      (() => {
        const saved = localStorage.getItem('ahadiya-theme-mode') || 'system';
        const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Ahadiya School</title>

    <!-- DNS prefetch + preconnect to API origin so TLS handshake happens during page parse -->
    <link rel="dns-prefetch" href="https://ahadiya-student-management-system.onrender.com" />
    <link rel="preconnect" href="https://ahadiya-student-management-system.onrender.com" crossorigin />

    <!-- Preload the Google Fonts CSS if used -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
